#set -g default-terminal "xterm-256color"
set -g default-terminal "screen-256color"
set -g focus-events on
setw -g monitor-activity on
set -g visual-activity on
set -g base-index 1
setw -g pane-base-index 1

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set-option -g status-interval 1
set-option -g status-left ''
set-option -g status-right '%l:%M%p'
set-option -g status-bg colour236
set-option -g status-fg colour48
set-option -g pane-active-border-fg colour31
set-option -g pane-border-fg colour15
set-window-option -g window-status-current-fg colour22
set-window-option -g window-status-current-bg colour15
set-window-option -g mode-keys vi
bind-key h select-pane -L
bind-key k select-pane -D
bind-key j select-pane -U
bind-key l select-pane -R

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'

set -g status-right "CPU:#{cpu_percentage} | Batt: #{battery_percentage} #{battery_icon} #{battery_remain}"
set -g @resurrect-strategy-vim 'session'
run -b '~/.tmux/plugins/tpm/tpm'

